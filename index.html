<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie-Finder</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="navbar">
        <nav>
          <div class="search">
            <input id="search" type="text" placeholder="Search Crypto" />
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
          </div>
          <div class="right-nav">
            <div class="converter">
              <label id="choose" for="currency">Choose a currency</label>
              <select name="currency" id="currency">
                choose a currency
                <option value="USD">USD</option>
                <option value="INR">INR</option>
                <option value="EUR">EUR</option>
                <option value="JPY">JPY</option>
                <option value="CHF">CHF</option>
              </select>
            </div>
            <div class="logo">CRYPTO TRACKER</div>
          </div>
        </nav>
      </div>
      <div class="hero">
        <div class="hero-section">
          <div class="user">
            <div class="img">
              <img src="assets/makima.jpeg" alt="User" />
            </div>
            <div class="fav">
              <div class="username"><h2>User</h2></div>

              <h3>Favorites</h3>
              <div class="spans">
                <span>BTC</span>
                <span>ETC</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="main">
        <div class="left"></div>
        <div class="right"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
