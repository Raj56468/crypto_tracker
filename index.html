<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie-Finder</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-container">
      <nav id="navbar">
        <ul id="list">
          <li class="list-items"><i class="fa-solid fa-house"></i> Home</li>
          <li class="list-items">
            <i class="fa-solid fa-magnifying-glass"></i> Search
          </li>
          <li class="list-items">
            <i class="fa-solid fa-clapperboard"></i> Movies
          </li>
          <li class="list-items">
            <i class="fa-solid fa-bookmark"></i> Watchlist
          </li>
          <li class="list-items"><i class="fa-solid fa-user"></i> User</li>
        </ul>
      </nav>
      <div class="hero-section">
        <h2>Intersteller</h2>
        <span>13+</span>
        <span>Sci-Fi</span>
        <span>Adventure</span>
        <p>
          When Earth becomes uninhabitable in the future, a farmer and ex-NASA
          pilot, Joseph Cooper, is taked to pilot a spacecraft, along with a
          team of researchers, to find a new planet for humans
        </p>
      </div>
      <div class="grid-movies">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
